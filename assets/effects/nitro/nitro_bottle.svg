<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e387a"/>
      <stop offset="20%" stop-color="#1e60c6"/>
      <stop offset="45%" stop-color="#429bf5"/>
      <stop offset="65%" stop-color="#1d6cd8"/>
      <stop offset="90%" stop-color="#0b3370"/>
      <stop offset="100%" stop-color="#061e45"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
