<?xml version="1.0" encoding="UTF-8"?>
<svg width="160" height="100" viewBox="0 0 160 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="pipeMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="interiorBore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="clampMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Forward Header Pipe leading to engine/chassis -->
  <path d="M 145,22 C 120,22 100,32 90,46" stroke="url(#pipeMetal)" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M 145,22 C 120,22 100,32 90,46" stroke="#111827" stroke-width="2.5" fill="none"/>

  <!-- Chassis Mount Flange & Bolts -->
  <rect x="136" y="10" width="14" height="24" rx="3" fill="url(#clampMetal)" stroke="#111827" stroke-width="2"/>
  <circle cx="143" cy="15" r="2.5" fill="#cbd5e1" stroke="#0f172a" stroke-width="1"/>
  <circle cx="143" cy="29" r="2.5" fill="#cbd5e1" stroke="#0f172a" stroke-width="1"/>

  <!-- Lower Exhaust Barrel (Muffler Body) -->
  <path d="M 40,68 L 105,50 L 108,66 L 43,84 Z" fill="url(#chromeGrad)" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 44,70 L 103,53" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Upper Exhaust Barrel -->
  <path d="M 28,48 L 95,30 L 98,46 L 31,64 Z" fill="url(#chromeGrad)" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 32,50 L 93,33" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Upper Pipe Tip Bevel & Inner Bore -->
  <ellipse cx="28" cy="56" rx="7" ry="10" fill="url(#interiorBore)" stroke="#111827" stroke-width="2.5" transform="rotate(-15 28 56)"/>
  <ellipse cx="28" cy="56" rx="4.5" ry="7" fill="#020617" transform="rotate(-15 28 56)"/>

  <!-- Lower Pipe Tip Bevel & Inner Bore -->
  <ellipse cx="40" cy="76" rx="7" ry="10" fill="url(#interiorBore)" stroke="#111827" stroke-width="2.5" transform="rotate(-15 40 76)"/>
  <ellipse cx="40" cy="76" rx="4.5" ry="7" fill="#020617" transform="rotate(-15 40 76)"/>

  <!-- Heat Shield / Bracket Band -->
  <rect x="75" y="32" width="9" height="42" rx="2" fill="url(#clampMetal)" stroke="#0f172a" stroke-width="2" transform="rotate(-15 79 53)"/>
  <circle cx="79" cy="44" r="2" fill="#cbd5e1"/>
  <circle cx="79" cy="62" r="2" fill="#cbd5e1"/>
</svg>
